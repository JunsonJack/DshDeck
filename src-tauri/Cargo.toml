[package]
name = "dshdeck"
version = "0.1.0"
description = "DshDeck — thin workbench for DeepSeek Harness (dsh) via ACP"
authors = ["DshDeck"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
which = "6"
ruzstd = "0.8"
serde_yaml = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
