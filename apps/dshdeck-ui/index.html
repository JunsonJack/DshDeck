<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DshDeck</title>
<link rel="icon" href="./assets/dsh-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-top">
      <div class="brand">
        <img class="brand-mark" src="./assets/dsh-mark.svg" alt="DshDeck" width="28" height="28" />
        <span>DshDeck</span>
      </div>
    </div>
    <div class="nav-list">
      <button class="nav-item" id="navNew"><span class="ico">⊕</span>新建会话</button>
      <button class="nav-item" id="navHist"><span class="ico">⌕</span>会话历史</button>
      <button class="nav-item" id="navHealth"><span class="ico">◷</span>健康检查</button>
    </div>
    <div class="seg" id="seg">
      <button class="active" data-tab="session">会话</button>
      <button data-tab="project">项目</button>
    </div>
    <div class="sec-head"><span id="sideTitle">项目</span></div>
    <div class="proj-list" id="projList"></div>
  </aside>

  <section class="main">
    <div class="titlebar">
      <div class="crumb" id="crumb">未连接</div>
      <div class="grow"></div>
      <div class="pill" id="health"><span class="dot"></span><span id="healthText">启动中…</span></div>
      <button class="win-btn" id="btnDiff" title="Diff">◫</button>
      <button class="win-btn close" id="btnShutdown" title="关闭连接">✕</button>
    </div>

    <div class="stage">
      <div class="welcome" id="welcome">
        <img class="app-logo" src="./assets/dsh-mark.svg" alt="DshDeck" width="96" height="96" />
        <button class="mode-row" id="modeRow"><span>💬</span><span>聊天</span><span class="caret">⌄</span></button>

        <div class="heat-card" id="heatCard">
          <div class="heat-tabs">
            <button class="active" data-heat="session">会话</button>
            <button data-heat="credits">Credits</button>
          </div>
          <div class="heat-grid-wrap">
            <div class="heat-grid" id="heatGrid"></div>
            <div class="heat-months" id="heatMonths"></div>
          </div>
          <div class="heat-legend">
            <span>少</span>
            <span class="heat-cell"></span>
            <span class="heat-cell l1"></span>
            <span class="heat-cell l2"></span>
            <span class="heat-cell l3"></span>
            <span class="heat-cell l4"></span>
            <span>多</span>
          </div>
        </div>

        <div class="composer" id="composerWelcome">
          <textarea id="inputW" rows="2" placeholder="输入消息，@ 引用文件，/ 运行命令，&amp; 引用会话..."></textarea>
          <div class="bar">
            <button class="icon" title="权限模式" id="btnPerm">🛡</button>
            <div class="qp-wrap"><button class="icon" title="快捷提示词" id="btnQpW">☰</button></div>
            <div class="spin" id="spinW"></div>
            <button class="model" id="btnModelW" title="模型 · 思考">
              <span data-model>…</span><span class="sep">·</span><span data-effort>思考</span><span class="caret">⌄</span>
            </button>
            <button class="send" id="btnSendW" title="发送">↑</button>
          </div>
        </div>
      </div>

      <div class="stream" id="stream"></div>
      <div class="dock">
        <div class="composer">
          <textarea id="input" rows="2" placeholder="输入消息，@ 引用文件，/ 运行命令，&amp; 引用会话..."></textarea>
          <div class="bar">
            <button class="icon" title="权限模式" id="btnPerm2">🛡</button>
            <div class="qp-wrap"><button class="icon" title="快捷提示词" id="btnQp">☰</button></div>
            <div class="spin" id="spin"></div>
            <button class="model" id="btnModel" title="模型 · 思考">
              <span data-model>…</span><span class="sep">·</span><span data-effort>思考</span><span class="caret">⌄</span>
            </button>
            <button class="send" id="btnSend" title="发送">↑</button>
          </div>
        </div>
      </div>

      <div class="diff" id="diffPane">
        <div class="diff-head">
          <span>DIFF</span><div class="grow"></div>
          <button class="icon" id="diffClose">✕</button>
        </div>
        <div class="diff-list hint" style="padding:16px">M1：工具写文件后展示 git diff（M2）。</div>
      </div>

      <div class="qp-pop" id="qpPop">
        <div class="qp-top">
          <div class="qp-search"><span>⌕</span><input id="qpSearch" placeholder="搜索快捷消息..." /></div>
          <button class="qp-icon" id="qpSort" title="管理">⚙</button>
        </div>
        <div class="qp-tip">点条目插入输入框，条目右侧按钮直接发送（回车插入首条）</div>
        <div class="qp-list" id="qpList"></div>
        <div class="qp-foot">
          <span id="qpCount"></span><div class="grow"></div>
          <div class="qp-pager">
            <button class="qp-page nav" id="qpPrev">‹</button>
            <span id="qpPages"></span>
            <button class="qp-page nav" id="qpNext">›</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="modal-mask" id="mqMask">
  <div class="modal">
    <div class="modal-head">
      <h2>快捷消息条目</h2>
      <p>排序 / 增删；最多 30 条。点「完成」写入本地配置。</p>
      <button class="icon close" id="mqClose">✕</button>
    </div>
    <div class="modal-body" id="mqList"></div>
    <div class="modal-mid">
      <button class="btn" id="mqAdd">＋ 添加</button>
    </div>
    <div class="modal-foot">
      <button class="linkish" id="mqReset">↻ 恢复默认</button>
      <div class="grow"></div>
      <button class="btn primary" id="mqDone">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
