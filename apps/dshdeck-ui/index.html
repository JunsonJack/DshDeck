<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DshDeck</title>
<link rel="icon" href="./assets/dsh-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-top">
      <div class="brand">
        <img class="brand-mark" src="./assets/dsh-mark.svg" alt="" width="22" height="22" />
        <span>DshDeck</span><span class="ver">0.1.0</span>
      </div>
    </div>
    <div class="nav-list">
      <button class="nav-item" id="navNew" title="新建会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>新建会话</span>
      </button>
      <button class="nav-item" id="navHist" title="会话历史（resume）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>
        <span>会话历史</span>
      </button>
    </div>
    <div class="sec-head">会话</div>
    <div class="proj-list" id="projList"></div>
    <div class="side-foot">dsh · acp bridge</div>
  </aside>

  <section class="main">
    <div class="titlebar">
      <div class="crumb" id="crumb">未连接</div>
      <div class="grow"></div>
      <div class="pill" id="health"><span class="dot"></span><span id="healthText">启动中…</span></div>
      <button class="tbtn" id="btnTheme" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="tbtn" id="btnDiff" title="审阅改动（git diff）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6M12 12v5M9.5 14.5h5"/></svg>
      </button>
      <button class="tbtn close" id="btnShutdown" title="断开连接">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="stage">
      <div class="alert" id="alertBar" hidden>
        <span id="alertText"></span>
        <div class="grow"></div>
        <button class="btn" id="alertAction" hidden></button>
        <button class="tbtn" id="alertClose" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="welcome" id="welcome">
        <div class="welcome-inner">
          <div>
            <img class="app-logo" src="./assets/dsh-mark.svg" alt="" width="52" height="52" />
            <h1>派个活给 dsh</h1>
            <p class="sub">会话过程实时可见 · 工具调用需审批 · 改动可用 diff 审阅</p>
          </div>

          <div class="composer" id="composerWelcome">
            <textarea id="inputW" rows="2" placeholder="描述任务，派给 dsh…（Enter 发送 · Shift+Enter 换行）"></textarea>
            <div class="bar">
              <div class="qp-wrap"><button class="icon" title="快捷消息" id="btnQpW">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
              </button></div>
              <div class="spin" id="spinW"></div>
              <button class="model" id="btnModelW" title="模型 · 思考强度（当前值来自 dsh）">
                <span data-model>…</span><span class="sep">·</span><span data-effort>…</span>
              </button>
              <button class="send" id="btnSendW" title="发送">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>

          <div class="recent" id="recent">
            <div class="recent-head"><span>最近会话</span></div>
            <div id="recentList"><div class="hint" style="padding:4px 2px">加载中…</div></div>
          </div>
        </div>
      </div>

      <div class="stream" id="stream"></div>

      <div class="dock">
        <div class="composer">
          <textarea id="input" rows="2" placeholder="描述任务，派给 dsh…（Enter 发送 · Shift+Enter 换行）"></textarea>
          <div class="bar">
            <div class="qp-wrap"><button class="icon" title="快捷消息" id="btnQp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            </button></div>
            <div class="spin" id="spin"></div>
            <button class="model" id="btnModel" title="模型 · 思考强度（当前值来自 dsh）">
              <span data-model>…</span><span class="sep">·</span><span data-effort>…</span>
            </button>
            <button class="send" id="btnSend" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="diff" id="diffPane">
        <div class="diff-head">
          <span>改动审阅</span><span class="diff-meta" id="diffMeta"></span>
          <div class="grow"></div>
          <button class="icon" id="diffClose" title="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="diff-list hint" id="diffList" style="padding:14px">派活后点这里审阅工作区改动（git diff）。</div>
      </div>

      <div class="model-pop" id="modelPop">
        <div class="mp-sec">模型</div>
        <div id="mpModels"></div>
        <div class="mp-sec">思考强度</div>
        <div id="mpEfforts"></div>
      </div>

      <div class="qp-pop" id="qpPop">
        <div class="qp-top">
          <div class="qp-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="qpSearch" placeholder="搜索快捷消息…" />
          </div>
          <button class="qp-icon" id="qpSort" title="管理快捷消息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          </button>
        </div>
        <div class="qp-tip">点条目插入输入框 · 右侧箭头直接发送 · 回车插入首条</div>
        <div class="qp-list" id="qpList"></div>
        <div class="qp-foot">
          <span id="qpCount"></span><div class="grow"></div>
          <div class="qp-pager">
            <button class="qp-page" id="qpPrev">‹</button>
            <span id="qpPages"></span>
            <button class="qp-page" id="qpNext">›</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="modal-mask" id="mqMask">
  <div class="modal">
    <div class="modal-head">
      <h2>管理快捷消息</h2>
      <p>排序 / 增删，最多 30 条，保存在本机。</p>
      <button class="close" id="mqClose" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="mqList"></div>
    <div class="modal-mid">
      <button class="btn" id="mqAdd">＋ 添加</button>
    </div>
    <div class="modal-foot">
      <button class="linkish" id="mqReset">恢复默认</button>
      <div class="grow"></div>
      <button class="btn primary" id="mqDone">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
